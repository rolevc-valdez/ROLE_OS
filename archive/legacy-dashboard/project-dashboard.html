<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ROLE · Mapa de proyectos</title>
  <style>
    :root{--bg:#f4f1ea;--panel:#fffdf8;--ink:#24231f;--muted:#747168;--line:#ded9ce;--accent:#315b4c;--accent2:#d9784a;--shadow:0 16px 40px rgba(45,42,34,.08);--radius:18px}
    *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
    button,input,select,textarea{font:inherit} button{cursor:pointer}.shell{max-width:1420px;margin:auto;padding:36px 34px 60px}
    header{display:flex;justify-content:space-between;gap:28px;align-items:flex-start;margin-bottom:28px}.eyebrow{font-size:12px;letter-spacing:.16em;font-weight:800;color:var(--accent);text-transform:uppercase}
    h1{font-family:Georgia,serif;font-size:clamp(36px,5vw,62px);line-height:1;margin:8px 0 12px;letter-spacing:-.035em}.subtitle{color:var(--muted);font-size:16px;max-width:680px;line-height:1.55;margin:0}
    .date{border:1px solid var(--line);background:rgba(255,255,255,.48);padding:12px 16px;border-radius:14px;color:var(--muted);white-space:nowrap}
    .toolbar{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;display:flex;gap:10px;align-items:center;box-shadow:var(--shadow);position:sticky;top:10px;z-index:5}
    .search{flex:1;min-width:180px;border:0;background:#f0ede6;border-radius:12px;padding:12px 14px;outline:none}.search:focus{box-shadow:0 0 0 2px var(--accent)}
    select,.btn{border:1px solid var(--line);background:#fff;padding:11px 13px;border-radius:12px;color:var(--ink)}.btn:hover{border-color:#b9b1a2}.btn.primary{background:var(--accent);border-color:var(--accent);color:white;font-weight:700}.btn.ghost{background:transparent}
    .stats{display:flex;gap:16px;margin:22px 2px;color:var(--muted);font-size:13px}.stats strong{color:var(--ink)}
    .group{margin-top:32px}.group-head{display:flex;align-items:center;gap:12px;margin-bottom:13px}.folder{width:34px;height:27px;background:#d9a24a;border-radius:4px 7px 6px 6px;position:relative}.folder:before{content:"";position:absolute;width:15px;height:6px;top:-4px;background:#d9a24a;border-radius:4px 4px 0 0}.group h2{font:700 18px Georgia,serif;margin:0}.count{font-size:12px;color:var(--muted);background:#e9e5dc;padding:3px 8px;border-radius:99px}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:19px;display:flex;flex-direction:column;min-height:236px;box-shadow:0 4px 18px rgba(45,42,34,.035);transition:.2s ease}.card:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:#c9c1b3}
    .card-top{display:flex;justify-content:space-between;gap:10px}.kind{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:750}.status{font-size:11px;font-weight:750;padding:5px 8px;border-radius:999px}.active{color:#1e684e;background:#dceee5}.completed{color:#315276;background:#dce8f3}.progress{color:#795017;background:#f7e9ca}.paused{color:#6f687e;background:#e8e4ef}.idea{color:#765449;background:#f4e3dc}
    .card h3{font:700 23px Georgia,serif;margin:16px 0 8px}.desc{font-size:14px;color:#5e5b54;line-height:1.5;margin:0 0 14px}.desc p,.use-content p{margin:0 0 7px}.desc a,.use-content a{color:var(--accent)}.use-content code{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;background:#f1eee7;padding:2px 4px;border-radius:4px;overflow-wrap:anywhere}.use{font-size:13px;line-height:1.45;margin:auto 0 15px;padding-left:12px;border-left:2px solid #d9a24a}.use-content{max-height:64px;overflow:hidden}.use.open .use-content{max-height:none}.more{border:0;background:transparent;color:var(--accent);font-size:12px;font-weight:750;padding:6px 0 0}.path{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;background:#f1eee7;padding:9px 10px;border-radius:9px;color:#69665e;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .actions{display:flex;gap:7px;margin-top:12px}.actions button,.actions a{border:1px solid var(--line);background:transparent;color:var(--ink);text-decoration:none;border-radius:9px;padding:7px 9px;font-size:12px}.actions button:hover,.actions a:hover{background:#eeeae1}.actions .edit{margin-left:auto}
    .rm-card{min-height:0}.rm-card .rm-meta{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin:4px 0 14px}.rm-meta div{border:1px solid var(--line);border-radius:10px;padding:8px;background:#f5f2eb}.rm-meta small{display:block;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.08em;font-weight:750;margin-bottom:3px}.rm-meta strong{font-size:12px}.rm-principle{font-size:12px;color:var(--muted);font-style:italic;margin:0 0 14px}.rm-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.rm-actions button,.rm-actions a{border:1px solid var(--line);background:transparent;color:var(--ink);text-decoration:none;border-radius:9px;padding:8px 10px;font-size:12px}.rm-actions button:hover,.rm-actions a:hover{background:#eeeae1}.rm-actions .rm-primary{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}.rm-actions .rm-secondary{border-style:dashed}.rm-guide{font-size:13px;line-height:1.5;margin:3px 0 14px;padding-left:12px;border-left:2px solid #d9a24a}.rm-guide ol{margin:7px 0 0;padding-left:19px}.rm-guide code{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;background:#f1eee7;padding:2px 4px;border-radius:4px}.rm-example{margin-top:9px;padding:9px 10px;background:#f1eee7;border-radius:9px;font-size:12px}.rm-status{color:#1e684e;background:#dceee5}
    .empty{text-align:center;padding:70px 20px;color:var(--muted)}
    dialog{border:0;border-radius:22px;padding:0;width:min(600px,calc(100% - 28px));box-shadow:0 30px 100px rgba(0,0,0,.26);background:var(--panel)}dialog::backdrop{background:rgba(32,31,28,.5);backdrop-filter:blur(3px)}
    .modal{padding:25px}.modal h2{font:700 28px Georgia,serif;margin:0 0 20px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:750;color:var(--muted)}.field input,.field select{border:1px solid var(--line);background:white;border-radius:10px;padding:10px;outline:none}.formatbar{display:flex;gap:5px;align-items:center;flex-wrap:wrap}.formatbar button{min-width:32px;border:1px solid var(--line);background:#f5f2eb;border-radius:7px;padding:5px 8px}.formatbar .expand-editor{margin-left:auto;min-width:auto}.rich-editor{border:1px solid var(--line);background:white;border-radius:10px;padding:10px;outline:none;min-height:82px;max-height:180px;overflow:auto;line-height:1.5}.rich-editor:focus{box-shadow:0 0 0 2px var(--accent)}.field.expanded-field{position:fixed;inset:4vh 4vw;z-index:20;background:var(--panel);padding:20px;border-radius:18px;box-shadow:0 30px 100px rgba(0,0,0,.35)}.field.expanded-field .rich-editor{height:calc(100% - 65px);max-height:none}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px}.danger{color:#9a3f34!important;margin-right:auto}
    .toast{position:fixed;right:24px;bottom:24px;background:#24231f;color:white;padding:12px 16px;border-radius:10px;opacity:0;transform:translateY(10px);pointer-events:none;transition:.2s}.toast.show{opacity:1;transform:none}
    @media(max-width:700px){.shell{padding:24px 16px 40px}header{display:block}.date{display:inline-block;margin-top:18px}.toolbar{flex-wrap:wrap;position:static}.search{flex-basis:100%}.toolbar select{flex:1}.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <main class="shell">
    <header><div><div class="eyebrow">ROLE workspace</div><h1>Mapa de proyectos</h1><p class="subtitle">Una vista simple de los proyectos, scripts y herramientas: qué es cada cosa, cómo se usa y dónde vive.</p></div><div class="date" id="today"></div></header>
    <section class="toolbar" aria-label="Controles del tablero">
      <input class="search" id="search" type="search" placeholder="Buscar proyecto, descripción o ruta…" aria-label="Buscar">
      <select id="statusFilter" aria-label="Filtrar por estado"><option value="all">Todos los estados</option><option>Activo</option><option>Completado</option><option>En progreso</option><option>Pausado</option><option>Idea</option></select>
      <button class="btn ghost" id="importBtn" title="Recuperar una copia de los datos">Importar</button>
      <button class="btn ghost" id="exportBtn" title="Guardar una copia de los datos">Exportar</button>
      <button class="btn primary" id="addBtn">+ Nuevo item</button>
      <input id="importInput" type="file" accept="application/json" hidden>
    </section>
    <div class="stats" id="stats"></div><div id="board"></div>
  </main>

  <dialog id="editor"><form class="modal" id="form" method="dialog"><h2 id="modalTitle">Nuevo item</h2><div class="fields">
    <div class="field"><label for="name">Nombre</label><input id="name" name="name" required></div>
    <div class="field"><label for="category">Categoría / carpeta</label><input id="category" name="category" list="categories" required><datalist id="categories"></datalist></div>
    <div class="field"><label for="kind">Tipo</label><select id="kind" name="kind"><option>Proyecto</option><option>Herramienta</option><option>Script</option><option>Repositorio</option><option>Referencia</option></select></div>
    <div class="field"><label for="status">Estado</label><select id="status" name="status"><option>Activo</option><option>Completado</option><option>En progreso</option><option>Pausado</option><option>Idea</option></select></div>
    <div class="field full"><label>Descripción breve</label><div class="formatbar"><button type="button" data-command="bold" data-target="description"><b>B</b></button><button type="button" data-command="italic" data-target="description"><i>I</i></button><button type="button" data-command="underline" data-target="description"><u>U</u></button><button type="button" data-command="createLink" data-target="description">🔗 Enlace</button></div><div id="description" class="rich-editor" contenteditable="true" role="textbox" aria-label="Descripción breve"></div></div>
    <div class="field full" id="usageField"><label>Cómo usarlo</label><div class="formatbar"><button type="button" data-command="bold" data-target="usage"><b>B</b></button><button type="button" data-command="italic" data-target="usage"><i>I</i></button><button type="button" data-command="underline" data-target="usage"><u>U</u></button><button type="button" data-command="createLink" data-target="usage">🔗 Enlace</button><button type="button" class="expand-editor" id="expandEditor">⛶ Expandir editor</button></div><div id="usage" class="rich-editor" contenteditable="true" role="textbox" aria-label="Cómo usarlo"></div></div>
    <div class="field full"><label for="path">Ruta local</label><input id="path" name="path" placeholder="C:\ruta\al\proyecto"></div>
    <div class="field full"><label for="url">Enlace útil (opcional)</label><input id="url" name="url" type="url" placeholder="https://…"></div>
  </div><div class="modal-actions"><button type="button" class="btn danger" id="deleteBtn">Eliminar</button><button type="button" class="btn" id="cancelBtn">Cancelar</button><button class="btn primary" value="save">Guardar</button></div></form></dialog>
  <div class="toast" id="toast" role="status"></div>
  <script>
    const ROOT='C:\\Users\\rolev\\My Drive (rolevc@gmail.com)\\1 - IA PROJECTS';
    const RM_ROOT=ROOT+'\\ROLE MASTER';
    const RM_PROMPT=`RM:

Usa ROLE MASTER.
Usa RM-000 como referencia visual canónica del personaje.

Proyecto:
[PROYECTO]

Crear:
[DESCRIPCIÓN]

Formato:
[FORMATO]

No reinventar al personaje.
No inventar logos.
No inventar tatuajes.
Mantener el estilo premium comic/editorial caricature de ROLE MASTER.`;
    const ROLE_MASTER={id:'role-master',category:'ROLE PROJECTS',name:'ROLE MASTER',kind:'Proyecto',status:'Completado',description:'Sistema canónico para crear contenido visual consistente de Role. <b>Version:</b> v1.0 · <b>Status:</b> PRODUCTION READY · <b>Framework:</b> LOCKED.',usage:'Usa <b>Crear con ROLE MASTER</b> para copiar el prompt base y abrir ChatGPT. Adjunta RM-000 para máxima consistencia visual y el logo oficial cuando la pieza lo utilice.',path:RM_ROOT,url:''};
    const starter=[
      ROLE_MASTER,
      {id:'commerce',category:'ROLE PROJECTS',name:'ROLE Commerce Factory',kind:'Proyecto',status:'En progreso',description:'Espacio de trabajo para iniciativas, automatizaciones y activos relacionados con commerce.',usage:'Entra a la carpeta del proyecto y revisa su documentación antes de ejecutar herramientas.',path:ROOT+'\\ROLE Commerce Factory',url:''},
      {id:'role-content-factory',category:'ROLE PROJECTS',name:'Role Content Factory',kind:'Proyecto',status:'En progreso',description:'<b>Plataforma local de automatización editorial</b> que convierte un tema en un proyecto estructurado de contenido y en videos verticales terminados, manteniendo aprobación humana en los puntos críticos.',usage:'<b>Objetivo:</b> producir contenido consistente para RoleValdez Tech mediante un flujo repetible, auditable y controlado por Role.<br><br><b>Inicio rápido:</b><br><code>cd C:\\Users\\rolev\\Documents\\role-content-factory</code><br><code>.venv\\Scripts\\activate</code><br><code>rcf studio</code><br><br>RCF Studio abre el dashboard local en <code>http://localhost:8501</code>.<br><br><b>Flujo principal:</b><ol><li><code>rcf new</code> — crear proyecto.</li><li><code>rcf brief</code> — completar brief.</li><li><code>rcf research</code> — incorporar investigación.</li><li><code>rcf script</code> y <code>rcf script approve</code> — crear y aprobar guion.</li><li><code>rcf storyboard</code> — generar storyboard.</li><li><code>rcf assets</code>, <code>rcf visual</code> y <code>rcf captions</code> — preparar recursos.</li><li><code>rcf voice</code> — generar narración.</li><li><code>rcf theme</code> — elegir estilo visual.</li><li><code>rcf render</code> — ensamblar el video final.</li></ol><b>Requisitos:</b> Python 3.12+, FFmpeg y FFprobe. Las integraciones de Pixabay, OpenAI y ElevenLabs son opcionales.<br><br><b>Estado:</b> versión candidata avanzada con RCF Studio, pipeline multimedia funcional, temas visuales, movimiento, render y más de mil pruebas registradas. Pendiente: aprobación formal del storyboard, publicación/programación y actualización de algunos documentos operativos.',path:'C:\\Users\\rolev\\Documents\\role-content-factory',url:''},
      {id:'role-dashboard',category:'ROLE PROJECTS',name:'ROLE DASHBOARD',kind:'Script',status:'En progreso',description:'Dashboard ligero para visualizar y organizar los proyectos, scripts y herramientas de ROLE.',usage:'Abre el archivo project-dashboard.html para consultar el mapa de proyectos. Desde la misma página puedes buscar, filtrar, crear y editar tarjetas, además de importar o exportar una copia de los datos.',path:ROOT+'\\ROLE DB',url:''},
      {id:'subir-libros-etsy',category:'SCRIPTS',name:'Subir Libros a ETSY',kind:'Script',status:'Activo',description:'Script para agregar o actualizar portadas de libros y enlaces en rolevaldez.com.',usage:'<b>Tener instalado:</b> <code>pip install Pillow python-dotenv</code><br><br><b>Abrir PowerShell en la carpeta del repositorio:</b><br><code>cd C:\\Users\\rolev\\Documents\\rolevaldez.com</code><br><br><b>Configurar el acceso:</b> copia <code>.env.example</code> como <code>.env</code> y agrega el valor de <code>GITHUB_TOKEN</code>.<br><br><b>Ejecutar:</b><br><code>python agregar_libro.py</code><br><br>El script pedirá la URL del listing de Etsy, la URL de la portada y los datos necesarios para agregar o actualizar el libro.',path:'C:\\Users\\rolev\\Documents\\rolevaldez.com\\agregar_libro.py',url:'https://rolevaldez.com'},
      {id:'ecosystem',category:'ROLE PROJECTS',name:'role-ecosystem',kind:'Repositorio',status:'Activo',description:'Componentes y piezas compartidas del ecosistema ROLE.',usage:'Úsalo como referencia para componentes comunes y conexiones entre proyectos.',path:ROOT+'\\role-ecosystem',url:''},
      {id:'knowledge',category:'SISTEMAS',name:'ROLE Knowledge OS',kind:'Herramienta',status:'Activo',description:'Sistema para estructurar, consultar y mantener conocimiento útil.',usage:'Abre la documentación del proyecto para localizar contenidos o actualizar la base de conocimiento.',path:ROOT+'\\ROLE_KNOWLEDGE_OS',url:''},
      {id:'role-os',category:'SISTEMAS',name:'ROLE OS',kind:'Herramienta',status:'Activo',description:'Sistema completo de operación y automatización de ROLE.',usage:'Usa este proyecto cuando necesites los flujos avanzados; para orientarte rápidamente, usa este mapa.',path:ROOT+'\\ROLE_OS',url:''},
      {id:'assets',category:'RECURSOS',name:'ROLE Assets',kind:'Referencia',status:'Activo',description:'Biblioteca de recursos y activos reutilizables para los proyectos.',usage:'Consulta esta carpeta cuando necesites materiales compartidos o quieras guardar un activo reutilizable.',path:ROOT+'\\ROLE ASSETS',url:''},
      {id:'others',category:'RECURSOS',name:'Otros · no proyectos',kind:'Referencia',status:'Pausado',description:'Material suelto y referencias que no pertenecen todavía a un proyecto formal.',usage:'Úsalo como zona de consulta o clasificación temporal; mueve lo estable a su proyecto correspondiente.',path:ROOT+'\\OTROS - no proyectos',url:''}
    ];
    const KEY='role-project-map-v1'; let items=load(),editing=null;
    const $=s=>document.querySelector(s), board=$('#board'), editor=$('#editor'), form=$('#form');
    function load(){try{let saved=JSON.parse(localStorage.getItem(KEY));if(!Array.isArray(saved))return starter;saved=saved.filter(x=>x.id!=='role-social-factory'&&x.id!=='role-master');const known=new Set(saved.map(x=>x.id));return [ROLE_MASTER,...saved,...starter.filter(x=>x.id!=='role-master'&&!known.has(x.id))]}catch{return starter}}
    function save(){localStorage.setItem(KEY,JSON.stringify(items))}
    function esc(v=''){return String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
    function statusClass(s){return {'Activo':'active','Completado':'completed','En progreso':'progress','Pausado':'paused','Idea':'idea'}[s]||'paused'}
    function rich(value=''){const doc=new DOMParser().parseFromString(`<div>${value}</div>`,'text/html'),allowed=new Set(['DIV','P','BR','B','STRONG','I','EM','U','A','UL','OL','LI','CODE']);doc.body.querySelectorAll('*').forEach(el=>{if(!allowed.has(el.tagName)){el.replaceWith(...el.childNodes);return}[...el.attributes].forEach(a=>{if(el.tagName!=='A'||!['href','target','rel'].includes(a.name))el.removeAttribute(a.name)});if(el.tagName==='A'){const href=el.getAttribute('href')||'';if(!/^https?:\/\//i.test(href))el.removeAttribute('href');else{el.target='_blank';el.rel='noopener'}}});return doc.body.firstElementChild.innerHTML}
    function fileUrl(path){return 'file:///'+encodeURI(path.replaceAll('\\','/')).replaceAll('#','%23')}
    function render(){
      const q=$('#search').value.trim().toLowerCase(),sf=$('#statusFilter').value;
      const visible=items.filter(x=>(sf==='all'||x.status===sf)&&Object.values(x).join(' ').toLowerCase().includes(q));
      const groups=Object.groupBy?Object.groupBy(visible,x=>x.category):visible.reduce((a,x)=>((a[x.category]??=[]).push(x),a),{});
      $('#stats').innerHTML=`<span><strong>${visible.length}</strong> items visibles</span><span><strong>${Object.keys(groups).length}</strong> carpetas</span><span>Los cambios se guardan en este navegador</span>`;
      board.innerHTML=visible.length?Object.entries(groups).map(([cat,list])=>`<section class="group"><div class="group-head"><span class="folder"></span><h2>${esc(cat)}</h2><span class="count">${list.length}</span></div><div class="grid">${list.map(card).join('')}</div></section>`).join(''):`<div class="empty"><h2>No hay resultados</h2><p>Prueba otra búsqueda o agrega un item nuevo.</p></div>`;
      $('#categories').innerHTML=[...new Set(items.map(x=>x.category))].map(x=>`<option value="${esc(x)}">`).join('');
    }
    function card(x){if(x.id==='role-master')return roleMasterCard();return `<article class="card"><div class="card-top"><span class="kind">${esc(x.kind)}</span><span class="status ${statusClass(x.status)}">${esc(x.status)}</span></div><h3>${esc(x.name)}</h3><div class="desc">${rich(x.description)}</div><div class="use" id="use-${x.id}"><strong>Cómo usarlo:</strong><div class="use-content">${rich(x.usage)}</div><button class="more" type="button" onclick="toggleUsage('${x.id}',this)">Ver más</button></div><div class="path" title="${esc(x.path)}">${esc(x.path||'Sin ruta')}</div><div class="actions">${x.path?`<a href="${fileUrl(x.path)}" title="Abrir ruta local">Abrir</a><button onclick="copyPath('${x.id}')">Copiar ruta</button>`:''}${x.url?`<a href="${esc(x.url)}" target="_blank" rel="noopener">Enlace ↗</a>`:''}<button class="edit" onclick="openEditor('${x.id}')">Editar</button></div></article>`}
    function roleMasterCard(){const rm000='assets/role-master/RM-000.png',logo='assets/role-master/rolevaldez_official.png';return `<article class="card rm-card"><div class="card-top"><span class="kind">ROLE visual system</span><span class="status rm-status">PRODUCTION READY</span></div><h3>ROLE MASTER</h3><div class="rm-meta"><div><small>Version</small><strong>v1.0</strong></div><div><small>Status</small><strong>PRODUCTION READY</strong></div><div><small>Framework</small><strong>LOCKED</strong></div></div><p class="rm-principle">“Describe qué quieres que Role haga. No vuelvas a describir quién es Role.”</p><div class="rm-actions"><button class="rm-primary" type="button" onclick="createWithRoleMaster()">Crear con ROLE MASTER</button><button type="button" onclick="copyRmPrompt()">Copiar prompt RM</button><a href="${rm000}" title="Abrir copia rápida local del Dashboard">RM-000 — Visual Bible</a><a href="${logo}" title="Abrir copia rápida local del Dashboard">RoleValdez.com — Official Logo</a><a href="${fileUrl(RM_ROOT)}" title="Abrir carpeta ROLE MASTER">Abrir ROLE MASTER</a><button class="rm-secondary" type="button" onclick="manageRoleMaster()" title="Copia el comando para administrar ROLE MASTER con Claude Code">Administrar con Claude Code</button></div><div class="rm-guide"><strong>CÓMO USAR</strong><p><b>OBLIGATORIO EN CHAT NUEVO:</b><br>Adjunta <code>RM-000.png</code> antes de generar una imagen con ROLE MASTER.</p><p><b>Si la imagen necesita branding:</b><br>Adjunta también <code>rolevaldez_official.png</code>.</p></div><div class="path" title="${esc(RM_ROOT)}">${esc(RM_ROOT)}</div></article>`}

    window.toggleUsage=(id,btn)=>{const box=document.getElementById('use-'+id);box.classList.toggle('open');btn.textContent=box.classList.contains('open')?'Ver menos':'Ver más'};
    window.copyPath=async id=>{const x=items.find(i=>i.id===id);try{await navigator.clipboard.writeText(x.path);toast('Ruta copiada')}catch{prompt('Copia la ruta:',x.path)}};
    async function copyText(text,success){try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text)}else{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.focus();ta.select();if(!document.execCommand('copy'))throw new Error('copy failed');ta.remove()}toast(success);return true}catch{prompt('Copia el texto:',text);return false}}
    window.copyRmPrompt=()=>copyText(RM_PROMPT,'Prompt RM copiado');
    window.createWithRoleMaster=()=>{const chat=window.open('https://chatgpt.com/','_blank','noopener');copyText(RM_PROMPT,'Prompt RM copiado · ChatGPT abierto');if(!chat)toast('Prompt copiado · permite pop-ups para abrir ChatGPT')};
    window.manageRoleMaster=()=>copyText(`cd /d "${RM_ROOT}" && claude`,'Comando de Claude Code copiado · pégalo en Terminal');
    window.openEditor=id=>{editing=id||null;const x=items.find(i=>i.id===id)||{name:'',category:'ROLE PROJECTS',kind:'Proyecto',status:'En progreso',description:'',usage:'',path:'',url:''};$('#usageField').classList.remove('expanded-field');$('#expandEditor').textContent='⛶ Expandir editor';$('#modalTitle').textContent=id?'Editar item':'Nuevo item';for(const k of ['name','category','kind','status','path','url'])form.elements[k].value=x[k]||'';$('#description').innerHTML=rich(x.description);$('#usage').innerHTML=rich(x.usage);$('#deleteBtn').hidden=!id;editor.showModal()};
    form.addEventListener('submit',e=>{e.preventDefault();if(!form.reportValidity())return;const data=Object.fromEntries(new FormData(form));data.description=rich($('#description').innerHTML);data.usage=rich($('#usage').innerHTML);if(!$('#description').innerText.trim()||!$('#usage').innerText.trim()){alert('Completa la descripción y cómo usarlo.');return}if(editing){items=items.map(x=>x.id===editing?{...x,...data}:x)}else{items.push({id:crypto.randomUUID(),...data})}save();render();$('#usageField').classList.remove('expanded-field');editor.close();toast('Cambios guardados')});
    $('#deleteBtn').onclick=()=>{if(confirm('¿Eliminar este item del mapa?')){items=items.filter(x=>x.id!==editing);save();render();editor.close();toast('Item eliminado')}};
    document.querySelectorAll('.formatbar [data-command]').forEach(btn=>btn.onclick=()=>{const target=document.getElementById(btn.dataset.target);target.focus();if(btn.dataset.command==='createLink'){const url=prompt('Pega el enlace completo (https://…):');if(url)document.execCommand('createLink',false,url)}else document.execCommand(btn.dataset.command,false,null)});
    $('#expandEditor').onclick=()=>{const f=$('#usageField'),open=f.classList.toggle('expanded-field');$('#expandEditor').textContent=open?'✕ Cerrar vista ampliada':'⛶ Expandir editor';$('#usage').focus()};
    $('#cancelBtn').onclick=()=>{$('#usageField').classList.remove('expanded-field');editor.close()};$('#addBtn').onclick=()=>openEditor();$('#search').oninput=render;$('#statusFilter').onchange=render;
    $('#exportBtn').onclick=()=>{const blob=new Blob([JSON.stringify(items,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='role-projects-backup.json';a.click();URL.revokeObjectURL(a.href);toast('Copia exportada')};
    $('#importBtn').onclick=()=>$('#importInput').click();
    $('#importInput').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data))throw 0;items=data;save();render();toast('Datos importados')}catch{alert('El archivo no tiene un formato válido.')}};
    function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
    $('#today').textContent=new Intl.DateTimeFormat('es-MX',{weekday:'long',day:'numeric',month:'long'}).format(new Date());render();
  </script>
</body>
</html>
